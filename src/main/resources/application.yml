spring:
  application:
    name: buildshield-discrepancy-service
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:discrepancy_db}
    username: ${DB_USER:discrepancy_service}
    password: ${DB_PASSWORD:discrepancy_service}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: 2000
      data-source-properties:
        options: "-c statement_timeout=${DB_STATEMENT_TIMEOUT_MS:5000} -c lock_timeout=${DB_LOCK_TIMEOUT_MS:2000}"
        connectTimeout: 5
        socketTimeout: 10
  servlet:
    multipart:
      # Las fotos de evidencia pesan hasta 5 MB (el servicio valida el límite y responde 400 con su código).
      max-file-size: 10MB
      max-request-size: 11MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
    admin:
      fail-fast: false
      properties:
        request.timeout.ms: 5000
        default.api.timeout.ms: 10000

server:
  # Detrás del gateway: Swagger "Try it out" usa el host del gateway (X-Forwarded-*).
  forward-headers-strategy: framework
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  default-produces-media-type: application/json
  api-docs:
    path: /api/v1/api-docs

buildshield:
  security:
    # Emisor de los tokens: los emite iam con su clave privada; este servicio solo valida con la pública.
    issuer: buildshield-iam
    jwt-public-key: ${BUILDSHIELD_JWT_PUBLIC_KEY}
    # La foto de una evidencia se pide desde <img src> sin cabecera Authorization: la autoriza la firma de su url
    # (?token=..., EvidenceUrlSigner), no el JWT.
    public-endpoints:
      - GET /api/v1/discrepancies/*/evidences/*/content
  # Escrituras sensibles a reintentos desde el celular: Idempotency-Key obligatoria (tabla idempotency_keys). La
  # subida de evidencias (multipart de hasta 5 MB) no la usa: el filtro limita a 1 MiB los cuerpos con clave.
  idempotency:
    enabled: true
    required-paths:
      - /api/v1/discrepancies/*/response
      - /api/v1/discrepancies/*/accept
      - /api/v1/discrepancies/*/escalate
      - /api/v1/discrepancies/*/resolve
  messaging:
    topic: buildshield.discrepancy
  evidence:
    # EvidenceStorageAdapter: carpeta local de las fotos de evidencia (Amazon S3 en la nube).
    local-dir: ${EVIDENCE_LOCAL_DIR:data/evidence}
    # Firma HMAC de las url de las fotos (al menos 16 caracteres) y su vigencia.
    url-secret: ${EVIDENCE_URL_SECRET:buildshield-dev-evidence-secret}
    url-ttl: ${EVIDENCE_URL_TTL:PT30M}
